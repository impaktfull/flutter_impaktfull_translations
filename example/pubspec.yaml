name: impaktfull_translations_example
description: A project used to demo the impaktfull_translations package
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  impaktfull_architecture: ^0.23.1
  impaktfull_ui: ^0.71.0
  intl: ^0.20.2
  provider: ^6.0.5
  sprintf: ^7.0.0

dev_dependencies:
  flutter_lints: ^2.0.1
  build_runner: ^2.4.4
  flutter_test:
    sdk: flutter
  impaktfull_translations:
    path: ../

dependency_overrides:
  intl: ^0.20.2

flutter:
  assets:
    - assets/localization/

# The API key is NOT here: set IMPAKTFULL_TRANSLATIONS_API_KEY in your shell
# or CI secrets. Replace project_id with your project's id, from its
# Settings > API keys tab in impaktfull translations.
impaktfull_translations:
  project_id: "00000000-0000-0000-0000-000000000000"
  default_language: "nl"
  languages: ["en", "nl"]
  locale_assets_path: "assets/localization"
  assets_path: "assets/localization"
